spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: room-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/rooms/**

        - id: meeting-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/meetings/**

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**

        - id: notification-ws
          uri: http://localhost:8084
          predicates:
            - Path=/ws-notifications/**

        - id: ai-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/ai/**

server:
  port: 8080

jwt:
  # Inject via env var JWT_SECRET; do NOT commit a real secret here
  secret: ${JWT_SECRET:CHANGE_ME_set_via_env_var}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.meetsync: DEBUG
